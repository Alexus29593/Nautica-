<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Nautica Residences by Nauma</title>
    <link rel="icon" type="image/png" href="NAUTT.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap');

        :root {
            --primary-color: #0A192F;
            --secondary-color: #C5A880; 
            --bg-color: #F4F5F6;
            --text-color: #1A1A1A;
            --card-bg: #FFFFFF;
            --accent-blue: #1E3345;
            --obra-bg: #F8F9FA;
            --border-color: #E2E8F0;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 0; 
            -webkit-font-smoothing: antialiased;
        }
        
        header { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 60px 20px; 
            text-align: center; 
            border-bottom: 1px solid var(--secondary-color); 
        }
        header h1 { 
            font-family: 'Playfair Display', serif; 
            font-weight: 400; 
            letter-spacing: 6px; 
            margin: 0; 
            font-size: 40px; 
            text-transform: uppercase; 
        }
        header p { 
            font-size: 11px; 
            letter-spacing: 8px; 
            margin-top: 15px; 
            color: var(--secondary-color); 
            text-transform: uppercase; 
            font-weight: 300; 
        }

        /* Contenedor de Filtros Estilo Editorial */
        .filters { 
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            padding: 30px 20px; 
            background-color: white; 
            flex-wrap: wrap; 
            align-items: flex-end;
            border-bottom: 1px solid var(--border-color);
        }
        .filter-group { 
            display: flex; 
            flex-direction: column; 
            min-width: 220px; 
        }
        .filter-group label { 
            font-weight: 500; 
            color: var(--primary-color); 
            margin-bottom: 8px; 
            font-size: 12px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .filter-group select { 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 0px; 
            font-family: 'Montserrat', sans-serif; 
            font-size: 14px; 
            outline: none; 
            cursor: pointer; 
            color: #4A5568;
            background-color: #FFF;
            transition: border-color 0.3s;
        }
        .filter-group select:focus {
            border-color: var(--secondary-color);
        }

        /* Barra de Rango Minimalista */
        .price-range { 
            width: 100%; 
            accent-color: var(--secondary-color); 
            cursor: pointer; 
            height: 3px; 
            background: var(--border-color); 
            outline: none; 
            margin-top: 15px; 
        }
        
        /* Botones de Ordenamiento */
        .sort-container { display: flex; gap: 1px; width: 100%; background: var(--border-color); }
        .btn-sort { 
            flex: 1; 
            padding: 12px; 
            border: none;
            background: white; 
            color: var(--primary-color); 
            border-radius: 0px; 
            font-family: 'Montserrat', sans-serif; 
            font-size: 12px; 
            font-weight: 500; 
            cursor: pointer; 
            transition: 0.3s; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-sort:hover, .btn-sort.active { 
            background: var(--primary-color); 
            color: white; 
        }

        /* Tablero de Ventas Elevado */
        .stats-bar { 
            padding: 35px 20px; 
            background: #FFFFFF; 
            color: var(--primary-color); 
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        .stats-main { 
            font-family: 'Playfair Display', serif;
            font-size: 22px; 
            font-weight: 400; 
            display: block; 
            margin-bottom: 20px; 
            letter-spacing: 1px;
        }
        .stats-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .stat-item { 
            background: var(--obra-bg); 
            padding: 10px 25px; 
            border-radius: 0px; 
            border: 1px solid var(--border-color); 
            font-weight: 400; 
            font-size: 13px; 
            letter-spacing: 0.5px;
        }
        .stat-highlight { 
            border: 1px solid var(--secondary-color); 
            background: #FFFDF9;
            font-weight: 500;
        }

        /* Grid de Catálogo Limpio */
        .catalog-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 40px; 
            padding: 50px 40px; 
            max-width: 1300px; 
            margin: 0 auto; 
        }
        .card { 
            background-color: var(--card-bg); 
            border-radius: 0px; 
            overflow: hidden; 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            cursor: pointer; 
            border: 1px solid var(--border-color); 
        }
        .card:hover { 
            transform: translateY(-4px); 
            border-color: var(--secondary-color); 
            box-shadow: 0 12px 30px rgba(0,0,0,0.04); 
        }
        .card-img-placeholder { 
            width: 100%; 
            height: 240px; 
            background-color: #FAFAFA; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-bottom: 1px solid #F0F0F0; 
        }
        .card-content { padding: 25px; text-align: left; }
        .card-title { 
            font-family: 'Playfair Display', serif; 
            font-size: 26px; 
            font-weight: 400; 
            color: var(--primary-color); 
            margin: 0 0 10px 0; 
        }
        .card-details { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 13px; 
            color: #666; 
            margin-bottom: 15px; 
            letter-spacing: 0.5px;
        }
        .card-price { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 20px; 
            font-weight: 400; 
            color: var(--secondary-color); 
            letter-spacing: 0.5px; 
        }

        /* Modal Rediseñado */
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(10, 25, 47, 0.4); 
            backdrop-filter: blur(8px);
            overflow-y: auto; 
        }
        .modal-content { 
            background-color: white; 
            margin: 4% auto; 
            border-radius: 0px; 
            max-width: 1050px; 
            display: flex; 
            flex-direction: row; 
            overflow: hidden; 
            position: relative; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .close { 
            color: var(--primary-color); 
            position: absolute; 
            top: 20px; 
            right: 25px; 
            font-size: 24px; 
            font-weight: 300; 
            cursor: pointer; 
            z-index: 50; 
            transition: color 0.3s;
        }
        .close:hover { color: var(--secondary-color); }
        
        .carousel-area { 
            flex: 1.2; 
            background-color: #F8F9FA; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            min-height: 480px; 
            border-right: 1px solid var(--border-color);
        }
        .slide-img { max-width: 90%; max-height: 440px; display: none; animation: fade 0.5s ease-in-out; object-fit: contain;}
        .slide-img.active { display: block; }
        @keyframes fade { from {opacity: 0.4} to {opacity: 1} }
        
        .nav-btn { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            background: transparent; 
            color: var(--primary-color); 
            border: none; 
            padding: 20px 15px; 
            cursor: pointer; 
            font-size: 20px; 
            z-index: 40; 
            transition: 0.3s; 
        }
        .nav-btn:hover { color: var(--secondary-color); }
        .prev { left: 5px; }
        .next { right: 5px; }

        .info-area { flex: 1; padding: 45px; background: white; overflow-y: auto; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        
        /* Botones Simulador */
        .btn-pago { 
            border: 1px solid var(--border-color); 
            padding: 14px 10px; 
            border-radius: 0px; 
            cursor: pointer; 
            color: var(--primary-color); 
            background: white; 
            font-weight: 500; 
            font-size: 11px; 
            transition: 0.3s; 
            line-height: 1.5; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-pago:hover, .btn-pago.active { 
            background: var(--primary-color); 
            color: white; 
            border-color: var(--primary-color);
        }
        
        .btn-capture { 
            width: 100%; 
            background: var(--secondary-color); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 0px; 
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 500; 
            cursor: pointer; 
            margin-top: 25px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
        }
        .btn-capture:hover { background: var(--primary-color); }
        
        .result-card { margin-top: 30px; display: none; border-top: 1px solid var(--border-color); padding-top: 20px; font-size: 14px;}
        .obra-block { background: var(--obra-bg); padding: 18px; border-radius: 0px; margin: 15px 0; border-left: 2px solid var(--secondary-color); }

        @media (max-width: 900px) { 
            .modal-content { flex-direction: column; margin: 0; width: 100%; height: 100%; } 
            .carousel-area { min-height: 320px; } 
            .filter-group { min-width: 100%; } 
            .catalog-grid { padding: 20px; gap: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>NAUTICA RESIDENCES</h1>
        <p>by NAUMA</p>
    </header>

    <div class="filters">
        <div class="filter-group"><label>Torre</label><select id="f-torre"><option value="all">Todas</option><option value="A">Torre A</option><option value="B">Torre B</option></select></div>
        <div class="filter-group"><label>Recámaras</label><select id="f-recamaras"><option value="all">Todas</option><option value="1">1 Recámara</option><option value="2">2 Recámaras</option><option value="3">3 Recámaras</option></select></div>
        <div class="filter-group"><label>Vista</label><select id="f-vista"><option value="all">Todas</option><option value="Exterior">Exterior</option><option value="Interior">Interior</option><option value="Laguna">Laguna</option><option value="Centro de ciudad">Centro de ciudad</option></select></div>
        
        <div class="filter-group">
            <label>Precio Máx: <span id="price-display" style="color:var(--secondary-color); font-weight: 600;">Cargando...</span></label>
            <input type="range" id="f-precio" class="price-range">
        </div>

        <div class="filter-group">
            <label>Ordenar Por Precio</label>
            <div class="sort-container">
                <button class="btn-sort" id="sort-low" onclick="toggleSort('low')">Menor</button>
                <button class="btn-sort" id="sort-high" onclick="toggleSort('high')">Mayor</button>
            </div>
        </div>
    </div>

    <div class="stats-bar" id="stats-bar">Actualizando tablero...</div>
    <div class="catalog-grid" id="catalog"></div>

    <div id="unitModal" class="modal">
        <div class="modal-content" id="capture-area">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="carousel-area" id="carousel-images"></div>
            <div class="info-area">
                <h2 id="modal-title" style="font-family:'Playfair Display', serif; font-size: 34px; font-weight: 400; margin-top: 0; color: var(--primary-color);">Unidad</h2>
                <div id="m-data" style="font-size:14px; line-height:1.9; margin-bottom:25px; color: #4A5568;"></div>
                <div style="font-weight:500; font-size:12px; text-transform:uppercase; margin-top:10px; letter-spacing: 1px; color: var(--primary-color);">Simulador de Pagos</div>
                <div class="btn-grid">
                    <button class="btn-pago" onclick="runCalc(this, 0.3, 0, 0.7, 0, 'Plan 30% / 70%')">30% Enganche<br>70% Entrega</button>
                    <button class="btn-pago" onclick="runCalc(this, 0.3, 0.4, 0.3, 0.04, 'Plan 30/40/30')">30% Eng / 40% Obra<br>30% Ent (4% Desc)</button>
                    <button class="btn-pago" onclick="runCalc(this, 0.5, 0.3, 0.2, 0.07, 'Plan 50/30/20')">50% Eng / 30% Obra<br>20% Ent (7% Desc)</button>
                    <button class="btn-pago" onclick="runCalc(this, 0.8, 0, 0.2, 0.12, 'Plan 80/20')">80% Enganche<br>20% Ent (12% Desc)</button>
                </div>
                <div class="result-card" id="res-card">
                    <div style="color:var(--secondary-color); font-size:20px; font-weight:500; margin-bottom:18px; font-family:'Playfair Display', serif;" id="res-plan-name"></div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; color: #4A5568;"><span>Precio de Lista:</span><span id="res-list"></span></div>
                    <div id="row-desc" style="display:none; justify-content:space-between; margin-bottom:10px; color:#c53030; font-weight:500;"><span>Ahorro Directo:</span><span id="res-desc-val"></span></div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; color: #4A5568;"><span>Enganche Inicial:</span><span id="res-down"></span></div>
                    <div id="obra-block" class="obra-block" style="display:none;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px; color: #4A5568;"><span>Pago en Obra:</span><span id="res-obra-total"></span></div>
                        <div style="display:flex; justify-content:space-between; align-items:center; color:var(--accent-blue);">
                            <span style="font-size:12px; text-transform: uppercase; letter-spacing: 0.5px;" id="res-months-label">mensualidades:</span>
                            <span style="font-weight:700; font-size:16px;" id="res-monthly-val"></span>
                        </div>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; color: #4A5568;"><span>Saldo a la Entrega:</span><span id="res-delivery"></span></div>
                    <div style="border-top:1px solid var(--primary-color); padding-top:15px; margin-top:15px; font-weight:500; font-size:18px; display:flex; justify-content:space-between; color: var(--primary-color);"><span>Costo Final:</span><span id="res-total"></span></div>
                    <div style="font-size:11px; color:#718096; font-style:italic; margin-top:15px;" id="res-note"></div>
                </div>
                <button class="btn-capture" id="btn-screenshot" onclick="generarCaptura()">📸 Capturar Ficha</button>
            </div>
        </div>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLW2Kd5jqnvnV0-lL3jnfs_r75V6xeMoCh9bS_pETsSrZTS1J1Tc3YViL2D8IbUZgRplHDUqt8GmZA/pub?output=tsv';
        let inventory = [], curPrice = 0, curTorre = "", slideIdx = 0;
        let touchstartX = 0, touchendX = 0;
        let activeSort = 'none';

        // Helper de optimización para parsing numérico de strings financieros
        function parsePrice(pStr) {
            return parseFloat(pStr.replace(/[^0-9.]/g, '')) || 0;
        }

        fetch(sheetUrl).then(r => r.text()).then(data => {
            const lines = data.trim().split('\n');
            inventory = lines.slice(1).map(l => {
                const c = l.split('\t');
                return { t: c[0].replace('TORRE ', '').trim(), u: c[1].trim(), r: c[2].trim(), m: c[4].trim(), area: c[5].trim(), v: c[6].trim(), p: c[8].trim(), disp: c[9].trim().toUpperCase() };
            }).filter(i => i.disp !== 'NO');
            
            setupPriceSlider();
            updateStats();
            applyFiltersAndSort();
        });

        function setupPriceSlider() {
            const numericPrices = inventory.map(i => parsePrice(i.p)).filter(p => !isNaN(p));
            if (numericPrices.length > 0) {
                const minPrice = Math.min(...numericPrices);
                const maxPrice = Math.max(...numericPrices);
                const slider = document.getElementById('f-precio');
                
                slider.min = minPrice;
                slider.max = maxPrice;
                slider.value = maxPrice;
                document.getElementById('price-display').innerText = fmt(maxPrice);
                
                slider.addEventListener('input', function() {
                    document.getElementById('price-display').innerText = fmt(this.value);
                    applyFiltersAndSort();
                });
            }
        }

        function updateStats() {
            const availA = inventory.filter(i => i.t === 'A').length, availB = inventory.filter(i => i.t === 'B').length;
            const soldA = 190 - availA, soldB = 190 - availB;
            document.getElementById('stats-bar').innerHTML = `
                <span class="stats-main">Tablero de Disponibilidad Nautica</span>
                <div class="stats-grid">
                    <div class="stat-item">Ventas Torre A: ${soldA} (${((soldA/190)*100).toFixed(1)}%)</div>
                    <div class="stat-item">Ventas Torre B: ${soldB} (${((soldB/190)*100).toFixed(1)}%)</div>
                    <div class="stat-item stat-highlight">Disponibles: ${inventory.length} de 380</div>
                </div>`;
        }

        function renderCatalog(data) {
            const grid = document.getElementById('catalog');
            grid.innerHTML = data.map(i => `
                <div class="card" onclick="openModal('${i.u}')">
                    <div class="card-img-placeholder"><img src="${i.m.toUpperCase().replace(/\s+/g,'')}-1.jpg" style="width:100%; height:100%; object-fit:contain;" onerror="this.src='comodin.jpg'"></div>
                    <div class="card-content">
                        <h3 class="card-title">Unidad ${i.u}</h3>
                        <div class="card-details">Torre ${i.t} &nbsp;|&nbsp; ${i.area} m²</div>
                        <div class="card-price">${i.p}</div>
                    </div>
                </div>`).join('');
        }

        function toggleSort(type) {
            const btnLow = document.getElementById('sort-low');
            const btnHigh = document.getElementById('sort-high');

            if (activeSort === type) {
                activeSort = 'none';
                btnLow.classList.remove('active');
                btnHigh.classList.remove('active');
            } else {
                activeSort = type;
                if (type === 'low') {
                    btnLow.classList.add('active');
                    btnHigh.classList.remove('active');
                } else {
                    btnHigh.classList.add('active');
                    btnLow.classList.remove('active');
                }
            }
            applyFiltersAndSort();
        }

        function applyFiltersAndSort() {
            const t = document.getElementById('f-torre').value;
            const r = document.getElementById('f-recamaras').value;
            const v = document.getElementById('f-vista').value.toLowerCase();
            const maxPriceSelected = parseFloat(document.getElementById('f-precio').value) || Infinity;

            let filtered = inventory.filter(i => {
                const itemPrice = parsePrice(i.p);
                return (t === 'all' || i.t === t) && 
                       (r === 'all' || i.r === r) && 
                       (v === 'all' || i.v.toLowerCase().includes(v)) &&
                       (itemPrice <= maxPriceSelected);
            });

            if (activeSort === 'low') {
                filtered.sort((a, b) => parsePrice(a.p) - parsePrice(b.p));
            } else if (activeSort === 'high') {
                filtered.sort((a, b) => parsePrice(b.p) - parsePrice(a.p));
            }

            renderCatalog(filtered);
        }

        function openModal(uId) {
            const item = inventory.find(i => i.u === uId);
            curPrice = parsePrice(item.p);
            curTorre = item.t;
            const modelKey = item.m.toUpperCase().replace(/\s+/g,'');
            const carousel = document.getElementById('carousel-images');

            document.getElementById('modal-title').innerText = `Unidad ${item.u}`;
            document.getElementById('m-data').innerHTML = `<b>Torre ${item.t}</b> &nbsp;&bull;&nbsp; Modelo ${item.m}<br>Vista ${item.v}<br>Entrega ${item.t === 'A' ? 'Dic 2028' : 'Jul 2029'}<br><span style="color:var(--secondary-color); font-size: 18px; font-weight:500;">Precio ${item.p}</span>`;
            
            carousel.innerHTML = `<button class="nav-btn prev" onclick="moveSlide(-1)">&#10094;</button><img class="slide-img active" src="${modelKey}-1.jpg" onerror="this.src='comodin.jpg'"><img class="slide-img" src="${modelKey}-2.jpg" onerror="this.style.display='none'"><img class="slide-img" src="${modelKey}-3.jpg" onerror="this.style.display='none'"><button class="nav-btn next" onclick="moveSlide(1)">&#10095;</button>`;
            
            carousel.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, {passive: true});
            carousel.addEventListener('touchend', e => { touchendX = e.changedTouches[0].screenX; if (touchendX < touchstartX - 50) moveSlide(1); if (touchendX > touchstartX + 50) moveSlide(-1); }, {passive: true});

            slideIdx = 0; 
            document.getElementById('res-card').style.display = 'none';
            document.querySelectorAll('.btn-pago').forEach(b => b.classList.remove('active'));
            document.getElementById('unitModal').style.display = 'block';
        }

        // Se eliminó el intervalo automático, ahora el movimiento es estrictamente controlado por el usuario
        function moveSlide(n) { 
            const s = document.querySelectorAll('.slide-img'), v = Array.from(s).filter(x => x.style.display !== 'none'); 
            if (v.length <= 1) return; 
            v[slideIdx].classList.remove('active'); 
            slideIdx = (slideIdx + n + v.length) % v.length; 
            v[slideIdx].classList.add('active'); 
        }

        function runCalc(btn, d, c, e, ds, n) {
            document.querySelectorAll('.btn-pago').forEach(b => b.classList.remove('active')); btn.classList.add('active');
            const final = curPrice * (1 - ds), m = curTorre === 'A' ? 31 : 43;
            document.getElementById('res-plan-name').innerText = n;
            document.getElementById('res-list').innerText = fmt(curPrice);
            if(ds > 0) { document.getElementById('row-desc').style.display = 'flex'; document.getElementById('res-desc-val').innerHTML = `- ${fmt(curPrice * ds)} (${Math.round(ds * 100)}%)`; } else { document.getElementById('row-desc').style.display = 'none'; }
            document.getElementById('res-down').innerText = fmt(final * d);
            const ob = document.getElementById('obra-block');
            if(c > 0) { ob.style.display = 'block'; document.getElementById('res-obra-total').innerText = fmt(final * c); document.getElementById('res-months-label').innerText = `${m} meses de:`; document.getElementById('res-monthly-val').innerText = fmt((final * c) / m); } else { ob.style.display = 'none'; }
            document.getElementById('res-delivery').innerText = fmt(final * e); document.getElementById('res-total').innerText = fmt(final);
            document.getElementById('res-note').innerText = `* Basado en entrega Torre ${curTorre} (${curTorre === 'A' ? 'Dic 2028' : 'Jul 2029'}).`;
            document.getElementById('res-card').style.display = 'block';
        }

        async function generarCaptura() {
            const area = document.getElementById('capture-area'), btn = document.getElementById('btn-screenshot'), cl = document.querySelector('.close'), nv = document.querySelectorAll('.nav-btn');
            btn.style.display = 'none'; cl.style.display = 'none'; nv.forEach(n => n.style.display = 'none');
            const canvas = await html2canvas(area, { scale: 2, useCORS: true, backgroundColor: "#FFFFFF" });
            const link = document.createElement('a'); link.download = `Nautica_${document.getElementById('modal-title').innerText.replace(/\s+/g,'_')}.png`; link.href = canvas.toDataURL('image/png'); link.click();
            btn.style.display = 'flex'; cl.style.display = 'block'; nv.forEach(n => n.style.display = 'block');
        }

        function fmt(n) { return '$ ' + Math.round(n).toLocaleString('es-MX'); }
        function closeModal() { document.getElementById('unitModal').style.display = 'none'; }
        
        document.querySelectorAll('select').forEach(s => s.addEventListener('change', applyFiltersAndSort));
    </script>
</body>
</html>
