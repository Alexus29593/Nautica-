<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario - Nautica Residences by Nauma</title>
    <link rel="icon" type="image/png" href="NAUTT.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary-color: #0A192F;
            --secondary-color: #C5A880; 
            --bg-color: #FBFBFC;
            --text-color: #111111;
            --card-bg: #FFFFFF;
            --accent-blue: #1A2E40;
            --obra-bg: #F7F8FA;
            --border-light: #E5E7EB;

            /* Tipografías Premium */
            --font-extended: 'TRADE GOTHIC LT STD EXTENDED', 'Trade Gothic Extended', 'Arial Black', sans-serif;
            --font-trade: 'Trade Gothic Lt Std', 'Trade Gothic', sans-serif;
            --font-gilroy: 'GILROY', 'Gilroy-Medium', 'Helvetica Neue', sans-serif;
        }

        /* Bloqueo absoluto de scroll horizontal y zoom inverso */
        html, body { 
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-family: var(--font-gilroy), sans-serif;
            font-weight: 300;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }
        
        header { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 80px 20px; 
            text-align: center; 
            border-bottom: 1px solid rgba(197, 168, 128, 0.3); 
        }
        header h1 { 
            font-family: var(--font-extended), sans-serif;
            font-weight: 700; 
            letter-spacing: 8px; 
            margin: 0; 
            font-size: 40px; 
            text-transform: uppercase; 
        }
        header p { 
            font-family: var(--font-extended), sans-serif;
            font-size: 11px; 
            letter-spacing: 10px; 
            margin-top: 18px; 
            color: var(--secondary-color); 
            text-transform: uppercase; 
            font-weight: 400; 
        }

        /* Contenedor de Filtros Lineal y Cuadrado */
        .filters { 
            display: flex; 
            justify-content: center; 
            gap: 40px; 
            padding: 45px 40px; 
            background-color: #F4F5F7; 
            flex-wrap: wrap; 
            align-items: flex-end;
            border-bottom: 1px solid var(--border-light);
            width: 100%;
        }
        .filter-group { 
            display: flex; 
            flex-direction: column; 
            flex: 1;
            min-width: 220px; 
            max-width: 280px;
        }
        .filter-group label { 
            font-family: var(--font-extended), sans-serif;
            font-weight: 700; 
            color: #718096; 
            margin-bottom: 12px; 
            font-size: 12px; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        
        /* Menus Desplegables Estilo Liquid Glass */
        .filter-group select { 
            padding: 12px 30px 12px 0px; 
            border: none;
            border-bottom: 2px solid rgba(197, 168, 128, 0.4); 
            border-radius: 0px; 
            font-family: var(--font-gilroy), sans-serif; 
            font-weight: 500;
            font-size: 15px; 
            outline: none; 
            cursor: pointer; 
            color: var(--primary-color);
            background: transparent; 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            appearance: none;
            text-align: left;      
            text-align-last: left; 
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%230A192F' d='M0 0l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 4px center; 
        }
        .filter-group select:focus, .filter-group select:hover {
            border-color: var(--secondary-color);
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px rgba(10, 25, 47, 0.01);
        }

        /* Rango de Precios Minimalista */
        .price-range { 
            width: 100%; 
            accent-color: var(--secondary-color); 
            cursor: pointer; 
            height: 2px; 
            background: #E2E8F0; 
            outline: none; 
            margin-top: 15px; 
        }
        
        /* Ordenamiento Tipo Boutique */
        .sort-container { display: flex; gap: 15px; width: 100%; }
        .btn-sort { 
            flex: 1; 
            padding: 11px 0; 
            border: none;
            border-bottom: 1px solid #CBD5E1;
            background: transparent; 
            color: #718096; 
            font-family: var(--font-extended), sans-serif; 
            font-size: 12px; 
            font-weight: 400; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: left;
        }
        .btn-sort:hover, .btn-sort.active { 
            color: var(--secondary-color);
            border-color: var(--secondary-color);
            font-weight: 700;
        }

        /* Dashboard de Alta Gama */
        .stats-bar { 
            background: #FFFFFF; 
            padding: 50px 40px;
            border-bottom: 1px solid var(--border-light);
            width: 100%;
        }
        .dashboard-container {
            max-width: 1300px;
            margin: 0 auto;
            text-align: center;
        }
        .stats-main { 
            font-family: var(--font-extended), sans-serif;
            font-size: 22px; 
            font-weight: 700; 
            display: block; 
            margin-bottom: 30px; 
            letter-spacing: 2px;
            color: var(--primary-color);
            text-transform: uppercase;
        }
        .dashboard-grid { 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border: 1px solid var(--border-light);
            background: white;
            position: relative;
        }
        .dashboard-item { 
            padding: 40px 20px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background: white;
        }
        .dashboard-item:last-child {
            border-right: none;
        }
        
        .dashboard-item:hover {
            background: var(--obra-bg);
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(10, 25, 47, 0.02);
            z-index: 5;
        }
        
        .dashboard-item.active {
            background: #FAFAFB;
        }
        .dashboard-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--secondary-color);
            transform: scaleX(0);
            transition: transform 0.35s ease;
        }
        .dashboard-item.active::after {
            transform: scaleX(1);
        }

        .dashboard-value {
            font-family: var(--font-extended), sans-serif;
            font-size: 34px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .dashboard-label {
            font-family: var(--font-gilroy), sans-serif;
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #718096;
        }
        
        .dashboard-highlight.active {
            background: #FFFDF9;
        }
        .dashboard-highlight .dashboard-value {
            color: var(--secondary-color);
        }

        /* Catálogo Reticular Estilo Galería */
        .catalog-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 50px; 
            padding: 60px 40px; 
            max-width: 1400px; 
            margin: 0 auto; 
            width: 100%;
        }
        .card { 
            background-color: transparent; 
            overflow: hidden; 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); 
            cursor: pointer; 
            border: none;
            border-bottom: 1px solid transparent;
        }
        .card:hover { 
            transform: translateY(-6px); 
            border-bottom: 1px solid var(--secondary-color); 
        }
        .card-img-placeholder { 
            width: 100%; 
            height: 260px; 
            background-color: #FFFFFF; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: background 0.4s;
        }
        .card:hover .card-img-placeholder {
            background-color: #F8F9FA;
        }
        .card-content { padding: 20px 0; text-align: left; }
        .card-title { 
            font-family: var(--font-gilroy), sans-serif; 
            font-size: 24px; 
            font-weight: 500; 
            color: var(--primary-color); 
            margin: 0 0 8px 0; 
            letter-spacing: 0.5px;
        }
        .card-details { 
            font-family: var(--font-gilroy), sans-serif; 
            font-size: 12px; 
            font-weight: 300; 
            color: #718096; 
            margin-bottom: 12px; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        .card-price { 
            font-family: var(--font-gilroy), sans-serif; 
            font-size: 20px; 
            font-weight: 500; 
            color: var(--secondary-color); 
            letter-spacing: 0.5px; 
        }

        /* Botón Comparar en Tarjeta - Rediseño sutil no invasivo */
        .btn-card-compare {
            background: transparent;
            border: none;
            color: #A0AEC0;
            font-family: var(--font-gilroy), sans-serif;
            font-size: 11px;
            font-weight: 400;
            padding: 4px 0;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
        }
        .btn-card-compare:hover, .btn-card-compare.active {
            color: var(--secondary-color);
            border-color: transparent;
            background: transparent;
            box-shadow: none;
            border-bottom: 1px solid var(--secondary-color);
            font-weight: 500;
        }

        /* Barra de Control de Comparativa Flotante (Compare Dock) */
        .compare-dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 25, 47, 0.94);
            border: 1px solid rgba(197, 168, 128, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 35px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            z-index: 900;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: auto;
            min-width: 450px;
            max-width: 90vw;
        }
        .compare-dock-info {
            color: white;
            font-family: var(--font-gilroy), sans-serif;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .btn-trigger-compare {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-family: var(--font-extended), sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-trigger-compare:hover {
            background: white;
            color: var(--primary-color);
        }

        /* Lienzo Reticular del Cuadro de Comparativa side-by-side */
        .compare-scroller {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
            border: 1px solid var(--border-light);
            background: white;
        }
        .compare-matrix {
            display: grid;
            width: 100%;
            min-width: 650px;
            background: #FFFFFF;
        }
        .compare-row {
            display: grid;
            border-bottom: 1px solid var(--border-light);
        }
        .compare-row:last-child {
            border-bottom: none;
        }
        .compare-cell {
            padding: 20px;
            font-size: 14px;
            color: #4A5568;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border-light);
            text-align: center;
            background: #FFFFFF;
        }
        .compare-cell:last-child {
            border-right: none;
        }
        .compare-cell.header-cell {
            font-family: var(--font-extended), sans-serif;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--primary-color);
            background: var(--obra-bg);
            letter-spacing: 1px;
        }

        /* Modales */
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(10, 25, 47, 0.15); 
            backdrop-filter: blur(12px);
            overflow-y: auto; 
        }
        .modal-content { 
            background-color: white; 
            margin: 3% auto; 
            border-radius: 0px; 
            max-width: 1150px; 
            display: flex; 
            flex-direction: row; 
            overflow: hidden; 
            position: relative; 
            box-shadow: 0 30px 70px rgba(0,0,0,0.1);
        }
        .close { 
            color: var(--primary-color); 
            position: absolute; 
            top: 25px; 
            right: 30px; 
            font-size: 28px; 
            font-weight: 200; 
            cursor: pointer; 
            z-index: 50; 
            transition: color 0.3s;
        }
        .close:hover { color: var(--secondary-color); }
        
        /* Efecto Zoom Inmersivo controlado en Carrusel */
        .carousel-area { 
            flex: 1.3; 
            background-color: #FFFFFF !important; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            min-height: 520px; 
            border-right: 1px solid var(--border-light);
            padding: 20px;
            overflow: hidden; /* Corta el desbordamiento del zoom */
        }
        .slide-img { 
            max-width: 95%; 
            max-height: 480px; 
            display: none; 
            animation: fade 0.6s cubic-bezier(0.25, 1, 0.5, 1); 
            object-fit: contain;
            cursor: zoom-in;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .slide-img.active { display: block; }
        .slide-img.active:hover {
            transform: scale(1.15); /* Efecto zoom refinado */
        }
        @keyframes fade { from {opacity: 0} to {opacity: 1} }
        
        .nav-btn { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            background: transparent; 
            color: var(--primary-color); 
            border: none; 
            padding: 30px 10px; 
            cursor: pointer; 
            font-size: 24px; 
            z-index: 40; 
            transition: 0.3s; 
            font-weight: 300;
        }
        .nav-btn:hover { color: var(--secondary-color); }
        .prev { left: 10px; }
        .next { right: 10px; }

        .info-area { flex: 1; padding: 50px; background: white; overflow-y: auto; }
        .btn-back-mobile { display: none; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 25px 0; }
        
        .btn-pago { 
            border: 1px solid var(--border-light); 
            padding: 16px 12px; 
            border-radius: 0px; 
            cursor: pointer; 
            color: var(--primary-color); 
            background: white; 
            font-family: var(--font-gilroy), sans-serif;
            font-weight: 500; 
            font-size: 11px; 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            line-height: 1.6; 
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .btn-pago:hover, .btn-pago.active { 
            background: var(--secondary-color); 
            color: white; 
            border-color: var(--secondary-color);
            box-shadow: 0 4px 15px rgba(197, 168, 128, 0.2);
        }
        
        .btn-capture { 
            width: 100%; 
            background: var(--primary-color); 
            color: white; 
            border: 1px solid var(--primary-color);
            padding: 18px; 
            border-radius: 0px; 
            font-family: var(--font-extended), sans-serif;
            font-size: 12px;
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 30px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s ease;
        }
        .btn-capture:hover { 
            background: var(--secondary-color); 
            border-color: var(--secondary-color); 
            box-shadow: 0 5px 20px rgba(197, 168, 128, 0.25);
        }
        
        .result-card { margin-top: 35px; display: none; border-top: 1px solid var(--primary-color); padding-top: 25px; font-size: 14px;}
        .res-row { display: flex; justify-content: space-between; margin-bottom: 12px; color: #4A5568; font-weight: 300; }
        .res-row span:last-child { font-weight: 500; color: var(--text-color); }
        
        .obra-block { background: var(--obra-bg); padding: 20px; border-radius: 0px; margin: 20px 0; border-left: 2px solid var(--secondary-color); }

        /* Adaptación móvil estricta */
        @media (max-width: 900px) { 
            header { padding: 70px 20px; }
            header h1 { font-size: 28px; }
            header p { font-size: 10px; letter-spacing: 8px; }

            .filters { padding: 40px 20px; gap: 25px; }
            .filter-group { min-width: 100%; max-width: 100%; }
            .filter-group select { font-size: 14px; padding: 12px 0px 12px 0px; background-position: right 4px center; }
            
            .stats-bar { padding: 40px 20px; }
            .stats-main { font-size: 18px; }
            .dashboard-grid { grid-template-columns: 1fr; border: 1px solid var(--border-light); }
            .dashboard-item { border-right: none; border-bottom: 1px solid var(--border-light); padding: 30px 20px; }
            .dashboard-item:last-child { border-bottom: none; }
            .dashboard-value { font-size: 28px; }
            
            .catalog-grid { padding: 40px 20px; gap: 40px; }
            .card-title { font-size: 22px; }
            .card-meta-row { flex-direction: row; justify-content: space-between; align-items: center; gap: 0px; }
            .btn-card-compare { width: auto; text-align: right; }

            .compare-dock { min-width: calc(100vw - 40px); bottom: 20px; padding: 12px 20px; gap: 15px; }
            .compare-dock-info { font-size: 12px; }

            .modal-content { 
                flex-direction: column; 
                margin: 0; 
                width: 100vw; 
                height: 100vh; 
                max-width: 100vw; 
                max-height: 100vh; 
            } 
            .carousel-area { min-height: 320px; max-height: 320px; border-right: none; border-bottom: 1px solid var(--border-light); padding: 10px; background-color: #FFFFFF !important;} 
            .info-area { padding: 30px 20px; }
            
            /* Botón de escape móvil embellecido */
            .btn-back-mobile {
                display: inline-flex;
                align-items: center;
                background: transparent;
                border: none;
                color: var(--secondary-color);
                font-family: var(--font-extended), sans-serif;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 2px;
                cursor: pointer;
                padding: 0 0 12px 0;
                text-transform: uppercase;
                width: 100%;
                border-bottom: 1px solid var(--border-light);
                margin-bottom: 25px;
                transition: color 0.3s ease;
            }
            .btn-back-mobile:hover {
                color: var(--primary-color);
            }

            .close { top: 15px; right: 20px; font-size: 26px; color: var(--primary-color); }
            .btn-grid { gap: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>NAUTICA RESIDENCES</h1>
        <p>by NAUMA</p>
    </header>

    <div class="filters">
        <div class="filter-group"><label>Torre</label><select id="f-torre"><option value="all">Todas</option><option value="A">Torre A</option><option value="B">Torre B</option></select></div>
        <div class="filter-group"><label>Recámaras</label><select id="f-recamaras"><option value="all">Todas</option><option value="1">1 Recámara</option><option value="2">2 Recámaras</option><option value="3">3 Recámaras</option></select></div>
        <div class="filter-group"><label>Vista</label><select id="f-vista"><option value="all">Todas</option><option value="Exterior">Exterior</option><option value="Interior">Interior</option><option value="Laguna">Laguna</option><option value="Centro de ciudad">Centro de ciudad</option></select></div>
        
        <div class="filter-group">
            <label>Precio Máx: <span id="price-display" style="color:var(--secondary-color); font-weight: 500;">Cargando...</span></label>
            <input type="range" id="f-precio" class="price-range">
        </div>

        <div class="filter-group">
            <label>Ordenar Por Precio</label>
            <div class="sort-container">
                <button class="btn-sort" id="sort-low" onclick="toggleSort('low')">Menor</button>
                <button class="btn-sort" id="sort-high" onclick="toggleSort('high')">Mayor</button>
            </div>
        </div>
    </div>

    <div class="stats-bar" id="stats-bar"></div>
    <div class="catalog-grid" id="catalog"></div>

    <div id="compare-dock" class="compare-dock">
        <div class="compare-dock-info" id="compare-count">0/3 seleccionadas</div>
        <button class="btn-trigger-compare" onclick="openCompareModal()">Comparar Unidades</button>
    </div>

    <div id="unitModal" class="modal">
        <div class="modal-content" id="capture-area">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="carousel-area" id="carousel-images"></div>
            <div class="info-area">
                <button class="btn-back-mobile" onclick="closeModal()">← Volver al inventario</button>
                
                <h2 id="modal-title" style="font-family: var(--font-gilroy), sans-serif; font-size: 32px; font-weight: 500; margin-top: 0; color: var(--primary-color); letter-spacing: 0.5px;">Unidad</h2>
                <div id="m-data" style="font-size:14px; line-height: 2; margin-bottom:30px; color: #4A5568; letter-spacing: 0.3px;"></div>
                <div style="font-family: var(--font-extended), sans-serif; font-weight:700; font-size:11px; text-transform:uppercase; margin-top:10px; letter-spacing: 2px; color: var(--primary-color);">Esquemas de Inversión</div>
                <div class="btn-grid">
                    <button class="btn-pago" onclick="runCalc(this, 0.3, 0, 0.7, 0, 'Plan 30% / 70%')">30% Enganche<br>70% Entrega</button>
                    <button class="btn-pago" onclick="runCalc(this, 0.3, 0.4, 0.3, 0.04, 'Plan 30/40/30')">30% Eng / 40% Obra<br>30% Ent (4% Desc)</button>
                    <button class="btn-pago" onclick="runCalc(this, 0.5, 0.3, 0.2, 0.07, 'Plan 50/30/20')">50% Eng / 30% Obra<br>20% Ent (7% Desc)</button>
                    <button class="btn-pago" onclick="runCalc(this, 0.8, 0, 0.2, 0.12, 'Plan 80/20')">80% Enganche<br>20% Ent (12% Desc)</button>
                </div>
                <div class="result-card" id="res-card">
                    <div style="color:var(--secondary-color); font-size:22px; font-weight:500; margin-bottom:20px; font-family: var(--font-gilroy), sans-serif; letter-spacing: 0.5px;" id="res-plan-name"></div>
                    <div class="res-row"><span>Precio de Lista:</span><span id="res-list"></span></div>
                    <div id="row-desc" class="res-row" style="display:none; color:#c53030; font-weight:500;"><span>Ahorro Directo:</span><span id="res-desc-val" style="color:#c53030; font-weight:500;"></span></div>
                    <div class="res-row"><span>Enganche Inicial:</span><span id="res-down"></span></div>
                    
                    <div id="obra-block" class="obra-block" style="display:none;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px; color: #4A5568; font-weight: 300; font-size: 14px;"><span>Estructura en Obra:</span><span id="res-obra-total" style="font-weight:500; color:var(--text-color);"></span></div>
                        <div style="display:flex; justify-content:space-between; align-items:center; color:var(--accent-blue);">
                            <span style="font-family: var(--font-extended), sans-serif; font-size:11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;" id="res-months-label">mensualidades:</span>
                            <span style="font-family: var(--font-extended), sans-serif; font-weight: 700; font-size: 20px;" id="res-monthly-val"></span>
                        </div>
                    </div>
                    
                    <div class="res-row"><span>Saldo a la Entrega:</span><span id="res-delivery"></span></div>
                    <div style="border-top:1px solid var(--border-light); padding-top:20px; margin-top:20px; font-weight:500; font-size:22px; display:flex; justify-content:space-between; color: var(--primary-color); font-family: var(--font-gilroy), sans-serif;"><span>Inversión Final:</span><span id="res-total" style="color: var(--primary-color); font-weight: 500;"></span></div>
                    <div style="font-size:11px; color:#718096; font-style:italic; margin-top:20px; letter-spacing: 0.3px;" id="res-note"></div>
                </div>
                <button class="btn-capture" id="btn-screenshot" onclick="generarCaptura()">📸 Exportar Ficha Comercial</button>
            </div>
        </div>
    </div>

    <div id="compareModal" class="modal">
        <div class="modal-content" id="compare-capture-wrapper" style="max-width: 1050px; flex-direction: column; padding: 40px; background: #FFFFFF;">
            <span class="close" id="btn-compare-close" onclick="closeCompareModal()">&times;</span>
            <h2 id="compare-modal-title" style="font-family: var(--font-extended), sans-serif; font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--primary-color); margin-top: 0; margin-bottom: 25px;">Cuadro Comparativo de Residencias</h2>
            
            <div class="compare-scroller" id="compare-table-scroller">
                <div id="compare-matrix" class="compare-matrix"></div>
            </div>
            
            <button class="btn-capture" id="btn-compare-screenshot" onclick="generarCapturaComparativa()" style="margin-top: 30px;">📸 Exportar Comparativa Comercial</button>
        </div>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLW2Kd5jqnvnV0-lL3jnfs_r75V6xeMoCh9bS_pETsSrZTS1J1Tc3YViL2D8IbUZgRplHDUqt8GmZA/pub?output=tsv';
        let inventory = [], curPrice = 0, curTorre = "", slideIdx = 0;
        let touchstartX = 0, touchendX = 0;
        let activeSort = 'none';
        let selectedForCompare = [];

        function parsePrice(pStr) {
            return parseFloat(pStr.replace(/[^0-9.]/g, '')) || 0;
        }

        // Extracción algorítmica de nivel/piso basado en nomenclatura de unidad inmobiliaria
        function parsePiso(uStr) {
            let clean = uStr.replace(/[^0-9]/g, '');
            if (uStr.toUpperCase().includes('PH')) return 'Penthouse';
            return clean.length > 2 ? clean.slice(0, -2) : 'Piso 1';
        }

        fetch(sheetUrl).then(r => r.text()).then(data => {
            const lines = data.trim().split('\n');
            inventory = lines.slice(1).map(l => {
                const c = l.split('\t');
                return { 
                    t: c[0].replace('TORRE ', '').trim(), 
                    u: c[1].trim(), 
                    r: c[2].trim(), 
                    m: c[4].trim(), 
                    area: c[5].trim(), 
                    v: c[6].trim(), 
                    p: c[8].trim(), 
                    disp: c[9].trim().toUpperCase(),
                    piso: parsePiso(c[1].trim()) // Inyección dinámica de propiedad Piso
                };
            }).filter(i => i.disp !== 'NO');
            
            setupPriceSlider();
            updateStats();
            applyFiltersAndSort();
        });

        function setupPriceSlider() {
            const numericPrices = inventory.map(i => parsePrice(i.p)).filter(p => !isNaN(p));
            if (numericPrices.length > 0) {
                const minPrice = Math.min(...numericPrices);
                const maxPrice = Math.max(...numericPrices);
                const slider = document.getElementById('f-precio');
                
                slider.min = minPrice;
                slider.max = maxPrice;
                slider.value = maxPrice;
                document.getElementById('price-display').innerText = fmt(maxPrice);
                
                slider.addEventListener('input', function() {
                    document.getElementById('price-display').innerText = fmt(this.value);
                    applyFiltersAndSort();
                });
            }
        }

        function updateStats() {
            const availA = inventory.filter(i => i.t === 'A').length, availB = inventory.filter(i => i.t === 'B').length;
            const soldA = 190 - availA, soldB = 190 - availB;

            document.getElementById('stats-bar').innerHTML = `
                <div class="dashboard-container">
                    <span class="stats-main">Tablero de Control & Disponibilidad</span>
                    <div class="dashboard-grid">
                        <div class="dashboard-item" id="dash-torre-a" onclick="dashboardFilter('torre', 'A')">
                            <div class="dashboard-value">${soldA} <span style="font-size:14px; color:#718096; font-weight:300;">(${((soldA/190)*100).toFixed(0)}%)</span></div>
                            <div class="dashboard-label">Torre A Comercializada</div>
                        </div>
                        <div class="dashboard-item" id="dash-torre-b" onclick="dashboardFilter('torre', 'B')">
                            <div class="dashboard-value">${soldB} <span style="font-size:14px; color:#718096; font-weight:300;">(${((soldB/190)*100).toFixed(0)}%)</span></div>
                            <div class="dashboard-label">Torre B Comercializada</div>
                        </div>
                        <div class="dashboard-item dashboard-highlight" id="dash-reset" onclick="dashboardFilter('reset', '')">
                            <div class="dashboard-value">${inventory.length}</div>
                            <div class="dashboard-label">Unidades disponibles</div>
                        </div>
                    </div>
                </div>`;
        }

        function dashboardFilter(type, val) {
            if (type === 'torre') {
                document.getElementById('f-torre').value = val;
            } else if (type === 'reset') {
                document.getElementById('f-torre').value = 'all';
                document.getElementById('f-recamaras').value = 'all';
                document.getElementById('f-vista').value = 'all';
                
                const slider = document.getElementById('f-precio');
                slider.value = slider.max;
                document.getElementById('price-display').innerText = fmt(slider.max);
                
                activeSort = 'none';
                document.getElementById('sort-low').classList.remove('active');
                document.getElementById('sort-high').classList.remove('active');
            }
            applyFiltersAndSort();
        }

        function renderCatalog(data) {
            const grid = document.getElementById('catalog');
            grid.innerHTML = data.map(i => {
                const isSelected = selectedForCompare.includes(i.u);
                return `
                <div class="card" onclick="openModal('${i.u}')">
                    <div class="card-img-placeholder"><img src="${i.m.toUpperCase().replace(/\s+/g,'')}-1.jpg" style="width:90%; height:90%; object-fit:contain;" onerror="this.src='comodin.jpg'"></div>
                    <div class="card-content">
                        <h3 class="card-title">Residencia ${i.u}</h3>
                        <div class="card-details">Torre ${i.t} &nbsp;&bull;&nbsp; ${i.area} m²</div>
                        <div class="card-meta-row">
                            <div class="card-price">${i.p}</div>
                            <button class="btn-card-compare ${isSelected ? 'active' : ''}" onclick="toggleCompare('${i.u}', event)">
                                ${isSelected ? '✓ Seleccionada' : '+ Comparar'}
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function toggleCompare(uId, event) {
            event.stopPropagation();
            const idx = selectedForCompare.indexOf(uId);
            
            if (idx > -1) {
                selectedForCompare.splice(idx, 1);
            } else {
                if (selectedForCompare.length >= 3) {
                    alert("El sistema de comparación permite un maximum de 3 unidades simultáneamente.");
                    return;
                }
                selectedForCompare.push(uId);
            }
            
            updateCompareDock();
            applyFiltersAndSort();
        }

        function updateCompareDock() {
            const dock = document.getElementById('compare-dock');
            const countText = document.getElementById('compare-count');
            
            if (selectedForCompare.length > 0) {
                dock.style.display = 'flex';
                countText.innerText = `${selectedForCompare.length}/3 Unidades seleccionadas`;
            } else {
                dock.style.display = 'none';
            }
        }

        function openCompareModal() {
            const matrix = document.getElementById('compare-matrix');
            const unitsData = selectedForCompare.map(uId => inventory.find(i => i.u === uId));
            
            let gridTemplate = `180px repeat(${selectedForCompare.length}, 1fr)`;
            matrix.style.gridTemplateColumns = gridTemplate;

            let html = `<div class="compare-cell header-cell">Residencia</div>`;
            unitsData.forEach(u => {
                html += `<div class="compare-cell" style="font-family: var(--font-extended); font-weight:700; color: var(--primary-color); font-size:15px;">Unidad ${u.u}</div>`;
            });

            html += `<div class="compare-cell header-cell">Arquitectura</div>`;
            unitsData.forEach(u => {
                const modelKey = u.m.toUpperCase().replace(/\s+/g,'');
                html += `<div class="compare-cell" style="background: #FFFFFF; padding: 12px;"><img src="${modelKey}-1.jpg" style="width:100%; max-width:140px; height:100px; object-fit:contain;" onerror="this.src='comodin.jpg'"></div>`;
            });

            html += `<div class="compare-cell header-cell">Torre</div>`;
            unitsData.forEach(u => {
                html += `<div class="compare-cell">Torre ${u.t}</div>`;
            });

            // Fila de Inyección: Piso/Nivel en Comparativa
            html += `<div class="compare-cell header-cell">Nivel / Piso</div>`;
            unitsData.forEach(u => {
                html += `<div class="compare-cell">${u.piso}</div>`;
            });

            html += `<div class="compare-cell header-cell">Metraje</div>`;
            unitsData.forEach(u => {
                html += `<div class="compare-cell" style="font-weight: 500;">${u.area} m²</div>`;
            });

            html += `<div class="compare-cell header-cell">Vista</div>`;
            unitsData.forEach(u => {
                html += `<div class="compare-cell">${u.v}</div>`;
            });

            html += `<div class="compare-cell header-cell">Costo de Lista</div>`;
            unitsData.forEach(u => {
                html += `<div class="compare-cell" style="color: var(--secondary-color); font-weight: 500; font-size:16px;">${u.p}</div>`;
            });

            matrix.innerHTML = html;
            document.getElementById('compareModal').style.display = 'block';
        }

        function closeCompareModal() {
            document.getElementById('compareModal').style.display = 'none';
        }

        async function generarCapturaComparativa() {
            const wrapper = document.getElementById('compare-capture-wrapper');
            const scroller = document.getElementById('compare-table-scroller');
            const matrix = document.getElementById('compare-matrix');
            
            const btnScreenshot = document.getElementById('btn-compare-screenshot');
            const btnClose = document.getElementById('btn-compare-close');
            
            btnScreenshot.style.display = 'none';
            btnClose.style.display = 'none';

            const originalScrollerOverflow = scroller.style.overflowX;
            const originalWrapperWidth = wrapper.style.width;

            const fullTableWidth = matrix.scrollWidth;
            scroller.style.overflowX = 'visible';
            if (window.innerWidth <= 900) {
                wrapper.style.width = `${fullTableWidth + 80}px`; 
            }

            document.querySelectorAll('.compare-cell').forEach(c => c.style.backgroundColor = '#FFFFFF');

            const canvas = await html2canvas(wrapper, {
                scale: 3, 
                useCORS: true,
                backgroundColor: "#FFFFFF",
                logging: false,
                letterRendering: true,
                imageTimeout: 0,
                windowWidth: wrapper.scrollWidth,
                windowHeight: wrapper.scrollHeight
            });

            const link = document.createElement('a');
            link.download = `Nautica_Comparativa_Residencias.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();

            scroller.style.overflowX = originalScrollerOverflow;
            wrapper.style.width = originalWrapperWidth;
            btnScreenshot.style.display = 'flex';
            btnClose.style.display = 'block';
        }

        function toggleSort(type) {
            const btnLow = document.getElementById('sort-low');
            const btnHigh = document.getElementById('sort-high');

            if (activeSort === type) {
                activeSort = 'none';
                btnLow.classList.remove('active');
                btnHigh.classList.remove('active');
            } else {
                activeSort = type;
                if (type === 'low') {
                    btnLow.classList.add('active');
                    btnHigh.classList.remove('active');
                } else {
                    btnHigh.classList.add('active');
                    btnLow.classList.remove('active');
                }
            }
            applyFiltersAndSort();
        }

        function applyFiltersAndSort() {
            const t = document.getElementById('f-torre').value;
            const r = document.getElementById('f-recamaras').value;
            const v = document.getElementById('f-vista').value.toLowerCase();
            const maxPriceSelected = parseFloat(document.getElementById('f-precio').value) || Infinity;

            let filtered = inventory.filter(i => {
                const itemPrice = parsePrice(i.p);
                return (t === 'all' || i.t === t) && 
                       (r === 'all' || i.r === r) && 
                       (v === 'all' || i.v.toLowerCase().includes(v)) &&
                       (itemPrice <= maxPriceSelected);
            });

            if (activeSort === 'low') {
                filtered.sort((a, b) => parsePrice(a.p) - parsePrice(b.p));
            } else if (activeSort === 'high') {
                filtered.sort((a, b) => parsePrice(b.p) - parsePrice(a.p));
            }

            document.querySelectorAll('.dashboard-item').forEach(item => item.classList.remove('active'));
            if (t === 'A') {
                document.getElementById('dash-torre-a')?.classList.add('active');
            } else if (t === 'B') {
                document.getElementById('dash-torre-b')?.classList.add('active');
            } else if (t === 'all') {
                document.getElementById('dash-reset')?.classList.add('active');
            }

            renderCatalog(filtered);
        }

        function openModal(uId) {
            const item = inventory.find(i => i.u === uId);
            curPrice = parsePrice(item.p);
            curTorre = item.t;
            const modelKey = item.m.toUpperCase().replace(/\s+/g,'');
            const carousel = document.getElementById('carousel-images');

            document.getElementById('modal-title').innerText = `Residencia ${item.u}`;
            document.getElementById('m-data').innerHTML = `<b>Torre ${item.t}</b> &nbsp;&bull;&nbsp; Arquitectura Modelo ${item.m}<br>Orientación de Vista: ${item.v}<br>Horizonte de Entrega: ${item.t === 'A' ? 'Diciembre 2028' : 'Julio 2029'}<br><br><span style="font-family: var(--font-gilroy); font-weight: 500; color:var(--primary-color); font-size: 22px;">${item.p}</span>`;
            
            carousel.innerHTML = `<button class="nav-btn prev" onclick="moveSlide(-1)">&#10094;</button><img class="slide-img active" src="${modelKey}-1.jpg" onerror="this.src='comodin.jpg'"><img class="slide-img" src="${modelKey}-2.jpg" onerror="this.style.display='none'"><img class="slide-img" src="${modelKey}-3.jpg" onerror="this.style.display='none'"><button class="nav-btn next" onclick="moveSlide(1)">&#10095;</button>`;
            
            carousel.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, {passive: true});
            carousel.addEventListener('touchend', e => { touchendX = e.changedTouches[0].screenX; if (touchendX < touchstartX - 50) moveSlide(1); if (touchendX > touchstartX + 50) moveSlide(-1); }, {passive: true});

            slideIdx = 0; 
            document.getElementById('res-card').style.display = 'none';
            document.querySelectorAll('.btn-pago').forEach(b => b.classList.remove('active'));
            document.getElementById('unitModal').style.display = 'block';
        }

        function moveSlide(n) { 
            const s = document.querySelectorAll('.slide-img'), v = Array.from(s).filter(x => x.style.display !== 'none'); 
            if (v.length <= 1) return; 
            v[slideIdx].classList.remove('active'); 
            slideIdx = (slideIdx + n + v.length) % v.length; 
            v[slideIdx].classList.add('active'); 
        }

        function runCalc(btn, d, c, e, ds, n) {
            document.querySelectorAll('.btn-pago').forEach(b => b.classList.remove('active')); btn.classList.add('active');
            const final = curPrice * (1 - ds), m = curTorre === 'A' ? 31 : 43;
            document.getElementById('res-plan-name').innerText = n;
            document.getElementById('res-list').innerText = fmt(curPrice);
            if(ds > 0) { document.getElementById('row-desc').style.display = 'flex'; document.getElementById('res-desc-val').innerHTML = `- ${fmt(curPrice * ds)} (${Math.round(ds * 100)}%)`; } else { document.getElementById('row-desc').style.display = 'none'; }
            document.getElementById('res-down').innerText = fmt(final * d);
            const ob = document.getElementById('obra-block');
            if(c > 0) { ob.style.display = 'block'; document.getElementById('res-obra-total').innerText = fmt(final * c); document.getElementById('res-months-label').innerText = `${m} aportaciones de:`; document.getElementById('res-monthly-val').innerText = fmt((final * c) / m); } else { ob.style.display = 'none'; }
            document.getElementById('res-delivery').innerText = fmt(final * e); document.getElementById('res-total').innerText = fmt(final);
            document.getElementById('res-note').innerText = `* Cotización preferencial vinculada a tiempos de obra para Torre ${curTorre} (${curTorre === 'A' ? 'Dic 2028' : 'Jul 2029'}).`;
            document.getElementById('res-card').style.display = 'block';
        }

        // Modificado para forzar SIEMPRE la primera imagen de la unidad en la captura HD
        async function generarCaptura() {
            const area = document.getElementById('capture-area');
            const btn = document.getElementById('btn-screenshot');
            const cl = document.querySelector('.close');
            const nv = document.querySelectorAll('.nav-btn');
            const backBtn = document.querySelector('.btn-back-mobile');
            
            btn.style.display = 'none'; 
            cl.style.display = 'none'; 
            nv.forEach(n => n.style.display = 'none');
            if (backBtn) backBtn.style.display = 'none';

            // Forzado estricto de la primera imagen en milisegundos para la captura
            const s = document.querySelectorAll('.slide-img'), v = Array.from(s).filter(x => x.style.display !== 'none');
            v.forEach(img => img.classList.remove('active'));
            if(v[0]) v[0].classList.add('active');

            const originalWidth = area.style.width;
            const originalHeight = area.style.height;
            const originalMaxHeight = area.style.maxHeight;
            const originalOverflow = area.style.overflow;
            
            if (window.innerWidth <= 900) {
                area.style.width = '100%';
                area.style.height = 'auto';
                area.style.maxHeight = 'none';
                area.style.overflow = 'visible';
                
                const infoArea = document.querySelector('.info-area');
                if (infoArea) {
                    infoArea.style.height = 'auto';
                    infoArea.style.maxHeight = 'none';
                    infoArea.style.overflow = 'visible';
                }
            }

            const carouselArea = document.getElementById('carousel-images');
            if (carouselArea) carouselArea.style.backgroundColor = '#FFFFFF';

            const canvas = await html2canvas(area, { 
                scale: 3, 
                useCORS: true, 
                backgroundColor: "#FFFFFF", 
                logging: false,
                letterRendering: true,
                imageTimeout: 0,
                windowWidth: area.scrollWidth,
                windowHeight: area.scrollHeight
            });
            
            const link = document.createElement('a'); 
            link.download = `Nautica_${document.getElementById('modal-title').innerText.replace(/\s+/g,'_')}.png`; 
            link.href = canvas.toDataURL('image/png', 1.0); 
            link.click();
            
            // Restauración del slide activo en el que se encontraba navegando el usuario
            v.forEach(img => img.classList.remove('active'));
            if(v[slideIdx]) v[slideIdx].classList.add('active');

            area.style.width = originalWidth;
            area.style.height = originalHeight;
            area.style.maxHeight = originalMaxHeight;
            area.style.overflow = originalOverflow;
            
            if (window.innerWidth <= 900) {
                const infoArea = document.querySelector('.info-area');
                if (infoArea) {
                    infoArea.style.height = '';
                    infoArea.style.maxHeight = '';
                    infoArea.style.overflow = '';
                }
            }

            btn.style.display = 'flex'; 
            cl.style.display = 'block'; 
            nv.forEach(n => n.style.display = 'block');
            if (backBtn) backBtn.style.display = 'inline-flex';
        }

        function fmt(n) { return '$ ' + Math.round(n).toLocaleString('es-MX'); }
        function closeModal() { document.getElementById('unitModal').style.display = 'none'; }
        
        document.querySelectorAll('select').forEach(s => s.addEventListener('change', applyFiltersAndSort));

        /* Cierre de modales al dar clic en el espacio vacío exterior */
        window.addEventListener('click', e => { 
            if (e.target === document.getElementById('unitModal')) closeModal(); 
            if (e.target === document.getElementById('compareModal')) closeCompareModal();
        });
    </script>
</body>
</html>
